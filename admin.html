<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chá de Bebê do Aydan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SCRIPT DE SENHA NO TOPO DA PÁGINA -->
    <script>
        const senha = prompt("Digite a senha do painel Admin:");
        if (senha !== "aydan1234") {
            alert("Senha incorreta! Acesso negado.");
            window.location.href = "index.html";
        }
    </script>

    <div class="container">
        <h1>Painel de Controle ⚙️</h1>
        <p>Bem-vindo ao painel do Chá de Bebê do Aydan.</p>
        
        <div class="card">
            <h2>📍 Configurar Localização</h2>
            <p>Clique no botão abaixo estando no local do evento para salvar a localização. Ela será atualizada automaticamente para os convidados.</p>
            <button id="btn-localizacao" class="btn">Adicionar Minha Localização Atual</button>
            <div id="resultado-mapa" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
